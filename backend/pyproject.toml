[project]
name = "hanrag-backend"
version = "0.1.0"
description = "HanRAG: Korean + English RAG platform with hybrid search, reranking and exact citations"
readme = "../README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "kiwipiepy>=0.25",
    "bm25s>=0.3.16",
    "fastembed>=0.9",
    "pymupdf>=2.1",
    "python-docx>=1.2",
    "google-genai>=3.6",
    "sse-starlette>=3.7",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.34",
    "orjson>=3.10",
    "olefile>=0.47",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Fallback embedding backend if the bge-m3 ONNX export fails to load in fastembed.
st = ["sentence-transformers>=6.3"]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "models: tests that download and run ML models (slow, skipped in CI)",
    "db: tests that need a running PostgreSQL + pgvector",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
