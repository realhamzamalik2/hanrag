name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests (no models, no DB)
        run: uv run pytest -q -m "not models and not db"
